# 本机工作区路径含中文（更好的末地）。Gradle 用 daemon 的 file.encoding 写 test worker 的
# @argfile，而 JDK 启动器按系统 ANSI 代码页展开该 argfile；两者不一致会把非 ASCII 的
# classpath 条目写坏（表现为该目录下测试类「Could not execute test class」）。
# 实测证据（本机，非推断）：
#   java -XshowSettings:properties -version  ->  native.encoding = GBK, sun.jnu.encoding = GBK,
#   而 file.encoding = UTF-8（Java 18+ 默认）；JDK 25 与 daemon JDK 26 均为同一组合。
#   工作区绝对路径 E:\我的世界插件\项目地址\更好的末地 含中文，故该不一致必然触发。
# 因此 daemon 写出与启动器读取都统一为 GBK；源码编码仍由 options.encoding=UTF-8 /
# filteringCharset=UTF-8 保证，二者互不影响。
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=GBK
systemProp.file.encoding=GBK

