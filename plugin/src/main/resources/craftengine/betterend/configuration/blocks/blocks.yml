          auto_state: lower_tripwire
          model: betterend:block/lanceleaf_leaf_middle
        pre_top:
          auto_state: lower_tripwire
          model: betterend:block/lanceleaf_leaf_pre_top
        top:
          auto_state: lower_tripwire
          model: betterend:block/lanceleaf_leaf_top
      variants:
        shape=bottom:
          appearance: bottom
        shape=pre_bottom:
          appearance: pre_bottom
        shape=middle:
          appearance: middle
        shape=pre_top:
          appearance: pre_top
        shape=top:
          appearance: top

