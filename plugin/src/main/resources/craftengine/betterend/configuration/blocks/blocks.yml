          type: furniture_item
          rules:
            ground:
              rotation: EIGHT
              alignment: center
          furniture:
            # 基座要"能放物品展示"，这是它和普通装饰方块的核心区别。
            # `display_item_furniture` 收 item_position（相对家具原点），
            # 0,0.875,0 = 模型顶面正中心（模型 y 范围实测 0~0.875）。
            behaviors:
              - type: display_item_furniture
                data_key: "craftengine:display_item"
                sounds:
                  put: minecraft:block.stone.place
                  take: minecraft:block.stone.hit
                variants:
                  ground:
                    item_position: 0,${ped_top},0
                    hitboxes:
                      - type: interaction
                        position: 0,0.875,0
                        width: 1.0
                        height: 0.2
                        can_use_item_on: true
                        interactive: true
            settings:
              item: betterend:${ped}
              hit_times: 1
              sounds:
                break: minecraft:block.stone.break
                place: minecraft:block.stone.place
                hit: minecraft:block.stone.hit
            variants:
              ground:
                elements:
                  # translation = 模型高度/2：CE 的物品展示实体把模型几何中心对齐原点，
                  # 不抬就会有一半埋进地里（和 BN 火盆同一个坑）。
                  - item: betterend:${ped}
                    translation: 0,${ped_dy},0
                    display_transform: none
                    billboard: fixed
                hitboxes:
                  # 基座碰撞是 1 x 0.875 x 1。shulker 的宽 = scale、高 = scale*(1+peek/100)，
                  # 单个给不出"1 宽 0.875 高"，所以用 4 个 scale=0.5 / peek=75 的拼 2x2：
                  # 每个 0.5 见方、0.5*(1+0.75)=0.875 高，合起来正好 1x0.875x1。
                  - type: shulker
                    position: -0.25,0,-0.25
                    direction: up
                    peek: 75
                    scale: 0.5
                    blocks_building: true
                    interactive: false
                    invisible: true
                  - type: shulker
                    position: 0.25,0,-0.25
                    direction: up
                    peek: 75
                    scale: 0.5
                    blocks_building: true
                    interactive: false
                    invisible: true
                  - type: shulker
                    position: -0.25,0,0.25
                    direction: up
                    peek: 75
                    scale: 0.5
                    blocks_building: true
                    interactive: false
                    invisible: true
                  - type: shulker
                    position: 0.25,0,0.25
                    direction: up
                    peek: 75
                    scale: 0.5
                    blocks_building: true
                    interactive: false
                    invisible: true
            loot:
              pools:
                - rolls: 1
                  entries:
                    - type: furniture_item
