  # --------- 来源：B1-wood-families.yml ---------

# --- family-structural blocks -------------------------------------------------------------
# None of the eight has a crafting recipe in generated/data/betterend/recipe/; they are all
# worldgen output of their tree feature. No `recipes:` section on purpose.

