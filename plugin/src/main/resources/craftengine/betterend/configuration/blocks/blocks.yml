  betterend:dragon_bone_block:
    type: shaped
    category: building
    group: dragon_bone_block
    pattern:
      - '###'
      - '#D#'
      - '###'
    ingredients:
      '#': minecraft:bone_block
      D: minecraft:dragon_breath
    result:
      id: betterend:dragon_bone_block
      count: 8
  # NOTHING ELSE HAS A RECIPE IN THE MOD. Verified against
  # generated/data/betterend/recipe/: zero json for ender_ore, amber_ore, endstone_dust,
  # mossy_obsidian, mossy_dragon_bone, brimstone, and neither ore smelts or blasts.
  #
  # DEBT, by real mechanic:
  #   ender_ore / amber_ore / endstone_dust / brimstone -- worldgen only (Phase 6/7).
  #   mossy_obsidian    -- bone meal on obsidian (BCLBlockTags.BONEMEAL_SOURCE_OBSIDIAN,
  #                        EndStoneBlocks.java:73). Needs a bone-meal block behavior.
  #   mossy_dragon_bone -- bone meal on dragon_bone_block (EndTags.BONEMEAL_SOURCE_DRAGON_BONE,
  #                        EndStoneBlocks.java:112). Same behavior.
  #   ender_shard / raw_amber -- ore loot table only, which is already configured above.
  # Do NOT paper over these with crafting recipes: an invented root outlives the worldgen
  # that replaces it and permanently cheapens the progression.

  # --------- 来源：dust_wastelands.yml ---------

# The ore/raw -> ingot smelts, verbatim from generated/data/betterend/recipe/
# thallasium_ingot_furnace_{ore,raw}_{smelting,blasting}.json. Those files carry no "experience"
# and no "cookingtime", so the vanilla codec defaults apply: 0.0 xp, 200 ticks smelting,
# 100 ticks blasting. This debt was recorded here when thallasium_ingot did not yet exist; it does
# now (items/B7-metals.yml), so it is paid.
#
# STILL MISSING, and it is the reason the metal tree stops here: terminite_ingot and
# aeternium_ingot are `bclib:alloying` (an End Stone Smelter recipe). CraftEngine registers no
# alloying serializer and ships no smelter block, so BOTH REMAIN UNOBTAINABLE. thallasium is the
# only metal a player can reach until an alloying replacement lands.
  betterend:thallasium_ingot_furnace_ore_smelting:
    type: smelting
    category: misc
    group: thallasium_ingot
    time: 200
    experience: 0.0
    ingredient: betterend:thallasium_ore
    result:
      id: betterend:thallasium_ingot
      count: 1
  betterend:thallasium_ingot_furnace_ore_blasting:
    type: blasting
    category: misc
    group: thallasium_ingot
    time: 100
    experience: 0.0
    ingredient: betterend:thallasium_ore
    result:
      id: betterend:thallasium_ingot
      count: 1
  betterend:thallasium_ingot_furnace_raw_smelting:
    type: smelting
    category: misc
    group: thallasium_ingot
    time: 200
    experience: 0.0
    ingredient: betterend:thallasium_raw
    result:
      id: betterend:thallasium_ingot
      count: 1
  betterend:thallasium_ingot_furnace_raw_blasting:
    type: blasting
    category: misc
    group: thallasium_ingot
    time: 100
    experience: 0.0
    ingredient: betterend:thallasium_raw
