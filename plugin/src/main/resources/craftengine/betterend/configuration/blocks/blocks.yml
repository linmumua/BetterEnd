# ================= B4 作物种子（原 B4-flora-crops-seeds.yml） =================
# 作物与种子类物品/方块

# BetterEnd -- batch B4 (flora-a): the three seed crops that were never registered.
# amber_root_seed / blossom_berry_seed / chorus_mushroom_seed are placed by Flora.ROWS through
# crop()+AGE3, so each needs a BlockDefinition with age 0..3 that matures at age=3; the models and
# textures were already shipped, only the registration was missing.
# This is a new file, not an edit of an existing one, so a server already holding the pack gets the
# three blocks filled in by the installer instead of having its own files replaced.
# Visual-state budget, and why these do not ride a vine pool.
# A group's real capacity is NOT its line count in CraftEngine's `mappings.yml`: a line such as
# `weeping_vines[age=7]` omits `berries`, so it donates BOTH berry states. weeping_vines and
# twisting_vines are written that way (25 lines x 2 = 50 each); sugar_cane has no second property
# (15); cave_vines enumerates berries and is 48.
# All 12 appearances used to sit on `weeping_vines`, and a live server reported that pool at its
# 50 cap; moving the three age_3 entries to `twisting_vines` then reported THAT pool at 50 too. Both
# vine pools are shared with packs and cached visual states this plugin does not control, and the
# vine family is small enough (50) that the shared draw exhausts it.
# `note_block` donates 1300 states and is the carrier CraftEngine's own default_assets uses for
# arbitrary custom blocks (drawer_block / safe_block, 12 draws), so it is both accepted and far
# beyond saturation. Crops keep identical collision and placement behaviour: the visual state only
# carries the model, the real state comes from the block's own settings.
# Deliberately not on higher_tripwire, whose family is already oversubscribed.

# 本文件的 items/blocks 条目已并入文末统一段（见「来源：B4-flora-crops-seeds.yml」小节）。

# ================= B4 水生作物（原 B4-flora-crops-water.yml） =================
# 水生作物与水下植物方块

# BetterEnd -- batch B4 (flora-a): crops, seeds and water plants
# Generated from the mod's own blockstate/model json; every `models:` list is a verbatim
# transcription of the mod's weighted variant list (AbstractBlockManager.java:988-1022 accepts
# path/x/y/z/uvlock/weight on a block-state model entry, exactly as vanilla does).
# One appearance = one visual state no matter how many weighted models it holds
# (AbstractBlockManager.java:615-648), so the random variants are free.
#
# AUTO-STATE POOLS (revised after the cross-batch audit): B4 does NOT use cave_vines/kelp/
# weeping_vines/twisting_vines. B5-flora-b claims 48/50 cave_vines, 24/25 kelp, 24/25 weeping and
# 24/25 twisting on its own, so any B4 draw on those four pools exhausts them
# (VisualBlockStateAllocator.java:137-155 -> StateExhaustedException). B4's plants sit on the
# tripwire pool instead, split so the halves cannot starve each other: AutoStateGroup.values()
# (AutoStateGroup.java:38-39,46) puts LOWER_TRIPWIRE and HIGHER_TRIPWIRE *before* the generic
# TRIPWIRE group, and processPendingAllocations walks the groups in that enum order, so the two
# halves are served first and the generic group only gets leftovers.
#   lower_tripwire  63: 19 (B1+B2) + 23 (B4 ground/wall plants) + 10 FarmersDelight = 60
#   higher_tripwire 63: 26 (B4) + 6 (B5 shards) + 3 (B4-flora-plants grasses)
#                       + 15 FarmersDelight + 1 shared explicit state             = 51
#   tripwire (generic) : 12 (B5 furs) + 1 CrabbersDelight, out of the 15 left over
# 2026 REMAP: 7 *_seed / growth blocks (28 states) were unshipped with the deferred growth blocks,
# and end_lotus_leaf moved off higher_tripwire onto a walkable trapdoor state -- it is a lily-pad
# platform in the mod and the tripwire donor gave it no collision at all. Together that returned
# 31 slots to a 126-state pool this pack shares with FarmersDelight, EndsDelight and
# BrewinAndChewin; latest.log recorded 6 tripwire-family exhaustion failures before the change.

# 本文件的 items/blocks 条目已并入文末统一段（见「来源：B4-flora-crops-water.yml」小节）。

# ================= B4 食物（原 B4-flora-foods.yml） =================
# 食物类物品与其合成/烧炼配方

# BetterEnd -- batch B4 (flora-a): the plant foods and drops.
# Food values are the mod's own (EndFoodItems.java:52-108); MobEffect side effects are dropped --
# `settings.food` is parsed by FoodData.fromConfig, which reads ONLY nutrition and saturation
# (FoodData.java:5-12, wired at ItemSettingsModifiers.java:194-197) -- no effects and not even
# can_always_eat -- so shadow_berry_jelly loses its 20s Night Vision.

