  # an ingredient whose item does not exist -- AbstractRecipeSerializer.parseIngredient:112-115
  # throws KnownResourceException("resource.recipe.ingredient.item_not_exist") -- so this recipe
  # would fail the whole file at load. Removed; neon_cactus_block is worldgen/creative-only until
  # neon_cactus itself is ported. Restore verbatim from generated/data/betterend/recipe/
