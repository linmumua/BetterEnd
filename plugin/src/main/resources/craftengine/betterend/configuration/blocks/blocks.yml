# 由 B1-wood-families.yml、B2-leaves-saplings.yml、B4-flora-crops-seeds.yml、B4-flora-crops-water.yml、B4-flora-foods.yml、B4-flora-plants.yml、B4-flora-terrain.yml、B5-flora-b.yml、B6-lanterns-stone.yml、B7-metals.yml、B8-storage-misc.yml、B8-storage-petals.yml、basic_blocks.yml、dust_wastelands.yml 各自顶层的 items: 内容合并而成；单文件内不得出现重复 id。
