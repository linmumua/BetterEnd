        facing=west:
          appearance: west

  # --------- 来源：B4-flora-crops-seeds.yml ---------

  # AmberRootBlock -- grows on betterend:amber_moss, drops raw amber root + itself.
  betterend:amber_root_seed:
    settings:
      template:
        - default:hardness/none
        - default:sound/grass
      merges:
        push_reaction: destroy
        map_color: plant
        is_randomly_ticking: true
        tags:
          - minecraft:sword_efficient
    behavior:
      - type: liquid_flowable_block
      - type: bush_block
        bottom_blocks:
          - betterend:amber_moss
      - type: crop_block
        grow_speed: 0.125
        light_requirement: 0
        is_bone_meal_target: true
        bone_meal_age_bonus: 1
    loot:
      template: default:loot_table/seed_crop
      arguments:
        crop_item: betterend:amber_root_raw
        crop_seed: betterend:amber_root_seed
        ripe_age: 3
    state:
      properties:
        age:
          type: int
          default: 0
          min: 0
          max: 3
      appearances:
        age_0:
          auto_state: note_block
          models:
            - path: betterend:block/amber_root_seed_0_0
            - path: betterend:block/amber_root_seed_0_1
        age_1:
          auto_state: note_block
          models:
            - path: betterend:block/amber_root_seed_1_0
            - path: betterend:block/amber_root_seed_1_1
        age_2:
          auto_state: note_block
          models:
            - path: betterend:block/amber_root_seed_2_0
            - path: betterend:block/amber_root_seed_2_1
        age_3:
          auto_state: note_block
          models:
            - path: betterend:block/amber_root_seed_3_0
            - path: betterend:block/amber_root_seed_3_1
      variants:
        age=0:
          appearance: age_0
        age=1:
          appearance: age_1
        age=2:
          appearance: age_2
        age=3:
          appearance: age_3
  # BlossomBerryBlock -- grows on betterend:pink_moss, drops blossom berry + itself.
  betterend:blossom_berry_seed:
    settings:
      template:
        - default:hardness/none
        - default:sound/grass
