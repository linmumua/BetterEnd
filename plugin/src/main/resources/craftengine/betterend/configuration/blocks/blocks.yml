  # LanceleafBlock -- 5 stacked segments grown from betterend:lanceleaf_seed. The mod's
  # `rotation` 0-3 is dropped (the segments have to stay aligned with each other), and there is
  # no CraftEngine behavior that grows a 5-segment column, so the segments are decorative:
  # the seed below grows but does not build the stack.
  betterend:lanceleaf:
    settings:
      template:
        - default:hardness/none
        - default:sound/grass
      merges:
        push_reaction: destroy
        map_color: plant
        tags:
          - minecraft:sword_efficient
    behavior:
      - type: liquid_flowable_block
      - type: bush_block
        bottom_blocks:
          - betterend:amber_moss
    # LanceleafBlock.buildLoot drops seeds, never itself. DEVIATION: lanceleaf_seed was unshipped
    # with the deferred growth blocks, so the plant self-drops rather than dropping nothing.
    loot:
      template: default:loot_table/self
    state:
      properties:
        shape:
          type: string
          values: [bottom, pre_bottom, middle, pre_top, top]
          default: bottom
      appearances:
