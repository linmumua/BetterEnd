# ================= B4 植物（原 B4-flora-plants.yml） =================
# 地表植物类方块

# BetterEnd -- batch B4 (flora-a): ground cross-plants, mosses and bushes
# Generated from the mod's own blockstate/model json; every `models:` list is a verbatim
# transcription of the mod's weighted variant list (AbstractBlockManager.java:988-1022 accepts
# path/x/y/z/uvlock/weight on a block-state model entry, exactly as vanilla does).
# One appearance = one visual state no matter how many weighted models it holds
# (AbstractBlockManager.java:615-648), so the random variants are free.
#
# AUTO-STATE POOLS (corrected after a config_factory-expanded recount -- the earlier grep totals were
# wrong twice over: they counted `auto_state:` text inside comments, and missed that a blueprint block
# multiplies its `auto_state` once per instance). Every pool below is shared with EVERY other pack, so
# the budget counts all known holders, never BetterEnd alone.
#   cave_vines   : pool 48. B5 claims 48; B4 used to add 2 -> 50 > 48, which exhausted the pool. Both
#                  B4 draws left it. No other known pack draws cave_vines.
#   sapling      : pool 8. BE used 6; twisted_umbrella_moss took the 7th, and CraftEngine's own
#                  default_assets palm_sapling (configuration/blocks/tree.yml) holds the 8th -> 8/8.
#                  A SECOND moss here would be BE 8 + CE 1 = 9 > 8 -- the overdraw this avoids.
#   weeping_vines: pool 25. B5's hanging vines claim 9 (five vines were dropped from that batch),
#                  so umbrella_moss takes the 10th -> 10/25. Neither FarmersDelight nor CE
#                  default_assets draw weeping_vines. DIFFERENCE from the cave_vines carrier this
#                  block used before: weeping_vines is `#minecraft:climbable` and cave_vines is not,
#                  so the client may show a climb anchor here; the block's own bush_block behaviour,
#                  model, id and light are unchanged.
#   tripwire     : ONE shared pool of 126 with three draw-halves (AutoStateGroup.java:41-42,47):
#                  LOWER_TRIPWIRE = attached=true (63), HIGHER_TRIPWIRE = attached=false (63), generic
#                  TRIPWIRE = all 126. The known holders used to over-subscribe it; dropping B5's
#                  blue_vine_fur -- a generic-TRIPWIRE block worth 6 states -- put it back inside the
#                  pool: BE lower 49 + higher 32 + generic 6 = 87, FarmersDelight lower 10 + higher
#                  20 = 30, CE default_assets lower 4 + higher 3 = 7 (pebble 3, ender_pearl_flower 2,
#                  magma_plant 2) -> 124 <= 126, two slots spare. Those two free slots are the only
#                  ones left, so neither moss goes here and BetterEnd adds nothing to it.
# (VisualBlockStateAllocator.java:137-155 -> StateExhaustedException). AutoStateGroup.values() order
# (AutoStateGroup.java:38-39,46) puts LOWER_TRIPWIRE and HIGHER_TRIPWIRE before generic TRIPWIRE.
#
# HONEST LIMIT: this pack sees only itself plus the packs staged in evidence (FarmersDelight, CE
# default_assets). A pack this repo cannot see may still exhaust sapling or weeping_vines; this change
# fixes BetterEnd's OWN overdraw and does not claim any other pack is safe.

# 本文件的 items/blocks 条目已并入文末统一段（见「来源：B4-flora-plants.yml」小节）。

# ================= B4 地形方块（原 B4-flora-terrain.yml） =================
# 地形与地表装饰方块

# BetterEnd -- batch B4 (flora-a): terrain cubes and their dirt-path variants
# Generated from the mod's own blockstate/model json; every `models:` list is a verbatim
# transcription of the mod's weighted variant list (AbstractBlockManager.java:988-1022 accepts
# path/x/y/z/uvlock/weight on a block-state model entry, exactly as vanilla does).
# One appearance = one visual state no matter how many weighted models it holds
# (AbstractBlockManager.java:615-648), so the random variants are free.

# ---------------------------------------------------------------------------
# 已摘除 surface_spreading_block 行为（止血修复；旧版 CraftEngine 上请勿恢复）
#
# 为什么摘：下面 15 个「苔藓 / 菌岩覆盖末地石」方块原先都挂着 surface_spreading_block 行为，
# 该行为的 randomTick 必经 canPropagate()，而 CraftEngine
#   SurfaceSpreadingBlockBehavior.java:114
#   （固定提交 b3079c5ac170fff2cb2a4c4dad184771a236cd1b，上游 main 分支同样如此、未修）
# 里 canPropagate 调的是 FluidStateProxy.INSTANCE.is$0(fluidState, FluidTagsProxy.WATER)。
# is$0 是 CraftEngine 按「索引」生成的桥接名：26.3 的
#   net.minecraft.world.level.material.FluidState
# 因新增 TypedInstance 接口而拥有五个 is(...) 重载（TagKey / HolderSet / Fluid / Holder /
# ResourceKey，见 MU核心 paper server 同名文件的「Paper start - optimise TypedInstance」段，
# 164-184 行），CE 的 is$0 恰好绑定到收 Fluid 的那个，于是把 FluidTags.WATER 的 TagKey 当 Fluid
# 传进去 —— 每次随机刻抛
#   ClassCastException: TagKey cannot be cast to Fluid
# （云端日志每秒数条的来源）。
#
# 为什么不能「等上游修」：这个行为是单向有害的。它 randomTick 只有两条分支：
#   - 枯死分支（源码 56-58 行）：canBeGrass 为假时把自己 setBlock 成 base_block
#     （本文件配的是 minecraft:end_stone），正常工作；
#   - 蔓延分支（源码 64-87 行）：75 行必经上面那个 canPropagate，永远抛异常，永远走不到。
# 净效果：苔藓只会退化成末地石、永远长不回来，末地的苔藓会被逐渐啃光。所以必须摘，拖不得。
#
# 摘掉后苔藓的实际行为变化（有意接受）：
#   - 失去「蔓延」（重新覆盖末地石）—— 本来就已因异常完全失效，无净损失；
#   - 失去「枯死 / 退化为 end_stone」—— 苔藓从此永久保留，不会再被啃成末地石。
#   其余一律未动：settings（hardness / resistance / map_color / is_randomly_ticking / tags）、
#   loot、state（auto_state: solid + models）保持原样。
#   is_randomly_ticking: true 有意保留 —— BukkitBlockManager 在「行为不是 RandomTickBlock」时
#   回落到 BlockSettings.isRandomlyTicking()（方块行为注册处的字节码分支），而基类
#   BlockBehavior.randomTick 是空实现（javap 即为 return），随机刻拦截器
#   BlockGenerator$RandomTickInterceptor 还整体 try/catch(Throwable)、只记 "Failed to run randomTick"。
#   也就是说：随机刻空转，不报错、不空指针，代价可忽略；保留它是为了上游修好后恢复该行为时
#   不必再改 settings。
#
# 上游修复后可恢复：判据是 CraftEngine 不再依赖 is$0 这类按索引的桥接名（或 canPropagate 改用
#   fluidState.is(FluidTags.WATER) 的 TagKey / HolderSet 重载）。验证方式：把各处的 behavior 段
#   加回去，日志不再出现该 ClassCastException，且苔藓能重新蔓延。原始写法保留在
#   upstream/BetterEnd-Plugin/plugin/src/main/resources/craftengine/betterend/configuration/blocks/B4-flora-terrain.yml。
#
# 每处方块只留两行标记注释，细节以本段为准。
# ---------------------------------------------------------------------------

