# CraftEngine BetterEnd 方块总表 —— 由原 18 个 yml 合并而成（语义零改变）。
#
# 分区：每个 "===== 标题 =====" 横幅对应一个原始文件，横幅下按原顺序保留该文件的
# config_factory#... / items#... / blocks#... 等带 # 后缀的段（逐字复制，# 后缀不可改，
# CE 靠 # 前文本选解析器并把同名段累加）。
# 各原始文件里「裸」的 items: / blocks: / recipes: 已全部并入文末三个统一段，
# 同名 id 不允许重复；每个统一段内部再按来源文件切小节。

# ================= B1 木族（原 B1-wood-families.yml） =================
# 四种 BetterEnd 木质家族（原木/木板等结构方块）的 config_factory 蓝图

# B1 -- the four BetterEnd wood families the live wood_sets.yml does not cover, plus the
# structural blocks their trees are built from.
#
# FOUR families, not five: lucernia_jellyshroom defines no log/planks at all --
# JellyLucerniaWoodMaterial.java:29-55 emits only a hanging sign and furniture, and
# getBlock() (:58-64) resolves PLANKS/SLAB/STRIPPED_LOG back to LUCERNIA's blocks.
#
# ponytail: slab/stairs/fence/button/sign omitted -- each burns a whole vanilla block from
# CraftEngine's shared state pool; walls have no default:block_state/wall template at all.
# ponytail: mossy_glowshroom's five random log/bark side textures (mossy_glowshroom_log_side_2..5,
# EndWoodBlocks.java:121-127 setLogVariants(1,1,1,1,1)) are dropped -- reproducing them means
# hand-writing three weighted appearances per id and lifting four ids out of the shared blueprint.
# Flat side texture instead; upgrade by un-factoring those four ids if it ever matters.

config_factory#b1_wood_sets:
  instances:
    # wood_map_color / planks_map_color are the mod's own EndWoodenComplexMaterial(name, woodColor,
    # planksColor) pair -- EndWoodBlocks.java:121-124, :156-159, :307-310, :340-343.
    - tree_type: mossy_glowshroom
      wood_map_color: color_gray
      planks_map_color: wood
    - tree_type: end_lotus
      wood_map_color: color_light_blue
      planks_map_color: color_cyan
    - tree_type: umbrella_tree
      wood_map_color: color_blue
      planks_map_color: color_green
    - tree_type: jellyshroom
      wood_map_color: color_purple
      planks_map_color: color_light_blue
  blueprint:
    items:
      betterend:${tree_type}_log:
        category: betterend:woods
        settings:
          fuel_time: 300
          tags:
            - betterend:${tree_type}_logs
            - minecraft:logs
            - minecraft:logs_that_burn
        data:
          item_name: '<!i><white><lang:item.betterend.${tree_type}_log></white>'
        model: betterend:block/${tree_type}_log
        behavior:
          type: block_item
          block: betterend:${tree_type}_log
      betterend:${tree_type}_stripped_log:
        category: betterend:woods
        settings:
          fuel_time: 300
          tags:
            - betterend:${tree_type}_logs
            - minecraft:logs
            - minecraft:logs_that_burn
        data:
          item_name: '<!i><white><lang:item.betterend.${tree_type}_stripped_log></white>'
        model: betterend:block/${tree_type}_stripped_log
        behavior:
          type: block_item
          block: betterend:${tree_type}_stripped_log
      betterend:${tree_type}_bark:
        category: betterend:woods
        settings:
          fuel_time: 300
          tags:
            - betterend:${tree_type}_logs
            - minecraft:logs
            - minecraft:logs_that_burn
        data:
          item_name: '<!i><white><lang:item.betterend.${tree_type}_bark></white>'
        model: betterend:block/${tree_type}_bark
        behavior:
          type: block_item
          block: betterend:${tree_type}_bark
      betterend:${tree_type}_stripped_bark:
        category: betterend:woods
        settings:
          fuel_time: 300
          tags:
            - betterend:${tree_type}_logs
            - minecraft:logs
            - minecraft:logs_that_burn
        data:
          item_name: '<!i><white><lang:item.betterend.${tree_type}_stripped_bark></white>'
        model: betterend:block/${tree_type}_stripped_bark
        behavior:
          type: block_item
          block: betterend:${tree_type}_stripped_bark
      betterend:${tree_type}_planks:
        category: betterend:woods
        settings:
          fuel_time: 300
          tags:
            - minecraft:planks
        data:
          item_name: '<!i><white><lang:item.betterend.${tree_type}_planks></white>'
        model: betterend:block/${tree_type}_planks
        behavior:
          type: block_item
          block: betterend:${tree_type}_planks
    blocks:
      betterend:${tree_type}_log:
        behavior:
          type: strippable_block
          stripped: betterend:${tree_type}_stripped_log
        settings:
          template: default:settings/wood
          merges:
            map_color: ${wood_map_color}
        loot:
          template: default:loot_table/self
        state:
          template: default:block_state/pillar
          arguments:
            pillar_model: betterend:block/${tree_type}_log
            pillar_texture_top: betterend:block/${tree_type}_log_top
            pillar_texture_side: betterend:block/${tree_type}_log_side
      betterend:${tree_type}_stripped_log:
        settings:
          template: default:settings/wood
          merges:
            map_color: ${wood_map_color}
        loot:
          template: default:loot_table/self
        state:
          template: default:block_state/pillar
          arguments:
            pillar_model: betterend:block/${tree_type}_stripped_log
            pillar_texture_top: betterend:block/${tree_type}_stripped_log_top
            pillar_texture_side: betterend:block/${tree_type}_stripped_log_side
      betterend:${tree_type}_bark:
        behavior:
          type: strippable_block
          stripped: betterend:${tree_type}_stripped_bark
        settings:
          template: default:settings/wood
          merges:
            map_color: ${wood_map_color}
        loot:
          template: default:loot_table/self
        # Mod bark model is cube_column with end == side == log side texture
        # (generated/assets/betterend/models/block/mossy_glowshroom_bark.json), so all six
        # faces are identical and one solid state is correct.
        state:
          auto_state: solid
          model: betterend:block/${tree_type}_bark
          texture: betterend:block/${tree_type}_log_side
      betterend:${tree_type}_stripped_bark:
        settings:
          template: default:settings/wood
          merges:
            map_color: ${wood_map_color}
        loot:
          template: default:loot_table/self
        state:
          auto_state: solid
          model: betterend:block/${tree_type}_stripped_bark
          texture: betterend:block/${tree_type}_stripped_log_side
      betterend:${tree_type}_planks:
        settings:
          template: default:settings/planks
          merges:
            map_color: ${planks_map_color}
        loot:
          template: default:loot_table/self
        state:
          auto_state: solid
          texture: betterend:block/${tree_type}_planks
    recipes:
      # NO ENTRY RECIPE. The mod grows these logs from trees; nothing crafts one from vanilla
      # material, so the family stays creative-only until the tree features land. Everything
      # below is the mod's own, verbatim -- generated/data/betterend/recipe/<family>_{log,bark,
      # stripped_log,stripped_bark,planks}.json.
      betterend:${tree_type}_log_from_bark:
        type: shaped
        category: building
        group: log
        pattern:
          - AA
          - AA
        ingredients:
          A: betterend:${tree_type}_bark
        result:
          id: betterend:${tree_type}_log
          count: 3
      betterend:${tree_type}_bark:
        type: shaped
        category: building
        group: bark
        pattern:
          - AA
          - AA
        ingredients:
          A: betterend:${tree_type}_log
        result:
          id: betterend:${tree_type}_bark
          count: 3
      betterend:${tree_type}_stripped_log:
        type: shaped
        category: building
        group: log
        pattern:
          - AA
          - AA
        ingredients:
          A: betterend:${tree_type}_stripped_bark
        result:
          id: betterend:${tree_type}_stripped_log
          count: 3
      betterend:${tree_type}_stripped_bark:
        type: shaped
        category: building
        group: bark
        pattern:
          - AA
          - AA
        ingredients:
          A: betterend:${tree_type}_stripped_log
        result:
          id: betterend:${tree_type}_stripped_bark
          count: 3
      betterend:${tree_type}_planks:
        type: shapeless
        category: building
        group: planks
        ingredients:
          - '#betterend:${tree_type}_logs'
        result:
          id: betterend:${tree_type}_planks
          count: 4

