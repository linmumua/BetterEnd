# ---------------------------------------------------------------------------------------------
# 4 chandeliers. ChandelierBlock extends BaseAttachedBlock, a 6-way FACING attached block, so
# `directional_attached_block` is the exact match: it requires a `facing` property whose value set
# has 6 entries (DirectionalAttachedBlockBehavior.java:42, :107) and attaches to facing.opposite()
# (:64-66). Its `blacklist` defaults to true with empty attached lists, i.e. "any sturdy face"
# (:71-79), which is what BaseAttachedBlock does -- so no extra keys.
# The four wall appearances are ONE model at four y rotations, matching the mod blockstate json;
# applyOtherBlockStateProperties (AbstractBlockManager.java:1000-1007) is what accepts `y`.
config_factory#b6_chandeliers:
  instances:
    - {metal: gold,       ingot: minecraft:gold_ingot,       hardness: 3.0, resistance: 6.0, map_color: gold,              instrument: bell, rod: lightning_rod}
    - {metal: iron,       ingot: minecraft:iron_ingot,       hardness: 5.0, resistance: 6.0, map_color: metal,             instrument: iron_xylophone, rod: exposed_lightning_rod}
    - {metal: terminite,  ingot: betterend:terminite_ingot,  hardness: 7.0, resistance: 9.0, map_color: warped_wart_block, instrument: iron_xylophone, rod: weathered_lightning_rod}
    - {metal: thallasium, ingot: betterend:thallasium_ingot, hardness: 5.0, resistance: 6.0, map_color: color_blue,        instrument: iron_xylophone, rod: oxidized_lightning_rod}
  blueprint:
    items:
      betterend:${metal}_chandelier:
        category: betterend:lights
        settings:
          tags:
            - betterend:lanterns
        data:
          item_name: '<!i><white><lang:item.betterend.${metal}_chandelier></white>'
        # generated/assets/betterend/items/<metal>_chandelier.json binds
        # betterend:item/<metal>_chandelier, an item/generated sprite -- unlike every other id in
        # this batch the chandelier item is NOT its block model.
        texture: betterend:item/${metal}_chandelier
        behavior:
          type: block_item
          block: betterend:${metal}_chandelier
    blocks:
      betterend:${metal}_chandelier:
        # Chandelier.java:40-46: RENDER_LAYER.cutout, lightLevel 15, noCollission, noOcclusion,
        # requiresCorrectToolForDrops, LOOT_TABLE.dropSelf. CE has no no-collision setting -- the
        # note_block host keeps its full cube hitbox. DEBT, cosmetic only.
        # hardness/resistance: terminite 7/9 (EndMetalBlocks.java:85-95), the rest 5/6
        # (MetalMaterial.java:186 .strength(5.0F, 6.0F)); gold takes vanilla gold_block 3/6.
        settings:
          template:
            - default:sound/metal
            - default:settings/transparent_1x1x1
          merges:
            hardness: ${hardness}
            resistance: ${resistance}
            luminance: 15
            push_reaction: destroy
            # gold copies Blocks.GOLD_BLOCK (BELL); the other three are IRON_XYLOPHONE
            # (MetalMaterial.java:186 / Blocks.IRON_BLOCK via VanillaMetalSet.java:39-41).
            instrument: ${instrument}
            map_color: ${map_color}
            require_correct_tools: true
            correct_tools: ['#minecraft:pickaxes']
            required_break_power: 1
            tags: [minecraft:mineable/pickaxe]
        loot:
          template: default:loot_table/self
        behavior:
          type: directional_attached_block
        state:
          properties:
            facing:
              type: 6-direction
              default: up
          appearances:
            up:
              state: ${rod}[facing=up,powered=false,waterlogged=false]
              model: betterend:block/${metal}_chandelier_floor
            down:
              state: ${rod}[facing=down,powered=false,waterlogged=false]
              model: betterend:block/${metal}_chandelier_ceil
            south:
              state: ${rod}[facing=south,powered=false,waterlogged=false]
              model: betterend:block/${metal}_chandelier_wall
            west:
              state: ${rod}[facing=west,powered=false,waterlogged=false]
              model:
                path: betterend:block/${metal}_chandelier_wall
                y: 90
            north:
              state: ${rod}[facing=north,powered=false,waterlogged=false]
              model:
                path: betterend:block/${metal}_chandelier_wall
                y: 180
            east:
              state: ${rod}[facing=east,powered=false,waterlogged=false]
              model:
                path: betterend:block/${metal}_chandelier_wall
                y: 270
          variants:
            facing=up:
              appearance: up
            facing=down:
              appearance: down
            facing=north:
              appearance: north
            facing=south:
              appearance: south
            facing=west:
              appearance: west
            facing=east:
              appearance: east
    recipes:
      # generated/data/betterend/recipe/<metal>_chandelier.json.
      # CROSS-BATCH: betterend:lumecorn_rod is a B5 item; terminite/thallasium ingots are B7.
      betterend:${metal}_chandelier:
        type: shaped
        category: building
        group: end_metal_chandelier
        pattern:
          - 'I#I'
          - ' # '
        ingredients:
          I: betterend:lumecorn_rod
          '#': ${ingot}
        result:
          id: betterend:${metal}_chandelier
          count: 1

