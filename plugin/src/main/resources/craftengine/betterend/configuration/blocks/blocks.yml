  # === CRYSTALS ============================================================
  # SulphurCrystalBlock: AGE 0-2 x 6-direction FACING, grows on brimstone
  # (EndStoneBlocks.java:150 withTag(SURVIVES_ON_BRIMSTONE)). That tag also lists
  # minecraft:cinnabar and minecraft:sulfur, which do not exist in this build, so only
  # betterend:brimstone (a live Phase-2 id) is listed.
  # WATERLOGGED is NOT ported: it would double 18 appearances to 36 for no visual gain.
  betterend:sulphur_crystal:
    behavior:
      type: directional_attached_block
      blacklist: false
      attached_blocks:
        - betterend:brimstone
    settings:
      template:
        - default:hardness/stone
        - default:sound/stone
      merges:
        hardness: 0.5
        resistance: 0.5
        push_reaction: destroy
        map_color: color_yellow
        # No require_correct_tools: EndStoneBlocks.java:148-154 registers sulphur_crystal with
        # MINEABLE_WITH.needsPickAxe() only -- it never calls requiresCorrectToolForDrops(),
        # unlike hydrothermal_vent five entries above it (:290). correct_tools below is kept
        # because it still governs mining speed.
        correct_tools:
          - '#minecraft:pickaxes'
        tags:
          - minecraft:mineable/pickaxe
    loot:
      # SulphurCrystalBlock.buildLoot (:87-125). The mod's second pool is gated on age==3 while
      # AGE only reaches 2 (:55) -- a dead condition, so in the mod the block silently drops
      # nothing without silk touch. Ported to the evident intent: ripe age 2 yields sulfur.
      pools:
        - rolls: 1
          conditions:
            - type: enchantment
              predicate: minecraft:silk_touch>=1
          entries:
            - type: item
              item: betterend:sulphur_crystal
        - rolls: 1
          conditions:
            - type: inverted
              term:
                type: enchantment
                predicate: minecraft:silk_touch>=1
            - type: match_block_property
              properties:
                age: 2
          entries:
            - type: item
              item: betterend:crystalline_sulphur
              functions:
                - type: set_count
                  add: false
                  count: 1~3
                - type: explosion_decay
    state:
      properties:
        age:
          type: int
          default: 0
          min: 0
          max: 2
        facing:
          type: 6-direction
          default: up
