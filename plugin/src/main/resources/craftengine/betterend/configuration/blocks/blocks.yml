  # NOT PORTED, by recipe type rather than by choice:
  #   terminite_ingot / terminite_ingot_thallasium / aeternium_ingot are `bclib:alloying`
  #   (an End Stone Smelter recipe); thallasium_ingot_furnace_ore/raw need thallasium_ore and
  #   thallasium_raw, which are not B7 ids. RecipeSerializers.java:28-45 registers shaped,
  #   shapeless, smelting, smoking, blasting, campfire_cooking, stonecutting, smithing_transform,
  #   smithing_trim and brewing -- there is no alloying serializer and no smelter block, so the
