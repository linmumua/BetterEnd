# NO RECIPE, by design, for:
#   emerald_ice / dense_snow / flavolite_runed -- no json in generated/data/betterend/recipe.
#     Worldgen and structure only (Phase 6/7).
#   smaragdant_crystal_pillar -- its json keys S to betterend:smaragdant_crystal_slab; slabs are
#     unportable in this pass. Ships uncraftable rather than with an invented root.
#   the 6 music discs, silk_fiber, silk_moth_matrix, gelatine, end_fish_raw/cooked,
#     enchanted_membrane, guidebook -- all mob or loot drops in the mod, no crafting json.
#
# UNPORTABLE IN THIS FILE'S SCOPE:
#   flavolite_runed_eternal -- EndStoneBlocks.java:271-278 gives it strength(-11, bedrock
#     resistance), i.e. unbreakable, and deliberately NO loot table. It is the Eternal Portal's
#     frame, placed only by a structure this phase does not have, and it has no obtainable item.
#     An unbreakable, unobtainable, unplaceable block buys nothing.
#   end_portal_block -- a portal renderer (models/block/end_portal.json has no parent and paints
#     the animated portal sampler). CE has no portal render path and no teleport behavior.
#   respawn_obelisk -- a 3-tall TripleShape multiblock whose entire point is setting the player's
#     End spawn. multi_high_block could stack the mesh, but a decorative obelisk that silently
#     does not set spawn is worse than an absent one. The 3 meshes are on disk and correct;
#     re-open this the moment a spawn-point behavior exists.
#   silk_moth_nest -- 2-tall (bottom cube + a cross-shaped top), ACTIVE x FACING x FULLNESS,
#     and it SPAWNS silk moths. The mobs are a later phase; without them the nest is furniture
#     with a misleading name.
#   lucernia_jellyshroom_taburet / _chair / _bar_stool -- the same bclib:block/{taburet,chair,
#     bar_stool} parents that block the other 30 seats. JellyLucerniaWoodMaterial.java:29-64
#     defines no log or planks of its own, so these three are its only B8 ids.

  # --------- 来源：B8-storage-pedestals.yml ---------

  # Only the 6 pedestals whose recipe json uses ingredients this port can actually supply.
  # The remaining 9 are listed under the comment at the bottom.
