  # vanilla's 200 (smelting) / 100 (blasting).
  betterend:end_stone_brick_cracked_smelting:
    type: smelting
    ingredient: minecraft:end_stone_bricks
    experience: 0.1
    time: 200
    result:
      id: betterend:end_stone_brick_cracked
      count: 1
  betterend:end_stone_brick_cracked_blasting:
    type: blasting
    ingredient: minecraft:end_stone_bricks
    experience: 0.1
    time: 100
    result:
      id: betterend:end_stone_brick_cracked
      count: 1
