  # EndMushroomBlocks.java:126-131 -- MapColor.COLOR_ORANGE, no light of its own (the glow belongs to
  # glowing_pillar_luminophor, B6). up/down use the hand-authored glowing_pillar_leaves_up mesh.
  betterend:glowing_pillar_leaves:
