# BetterEnd 客户端本地化 + 服务端译名（合并自 configuration/langs/ 目录，逐段原样搬运）。
# 段名一律是 `键#后缀`：AbstractPackManager 只取 '#' **之前**的文本选择解析器
# （lang -> LangParser / translations -> TranslationParser），TranslationManagerImpl
# 按段**累加**进 clientLangData，不是替换。所以后缀一个字都不能改——
# 一旦两个段同名，后加载的会静默覆盖前一个，且不报错。
# 文件级加载：CE 对 configuration 目录做全递归扫描（AbstractPackManager 的
# Files.walkFileTree(..., Integer.MAX_VALUE)），原 langs/ 子目录里的这些段本来就在加载，
# 合并到同目录单文件不改变加载结果。
# 每个 `lang#...` 段会烘焙成资源包里的 assets/minecraft/lang/<语言>.json；
# `translations#...` 只是服务端字符串，供 <l10n:...> 解析。
# 字符串逐字来自模组 assets/betterend/lang/*.json，不要美化。


