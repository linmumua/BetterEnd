# mirror the English file; only human-readable values are translated. Legacy section-sign colour
# codes are preserved verbatim, and proper nouns (BetterEnd, the music-disc artists) keep their
# original spelling. Section ids carry a _zh_cn suffix so this file never declares the same
# `lang#...` id as its English counterpart: AbstractPackManager.java:757-768 picks the parser from
# the text BEFORE '#', and TranslationManagerImpl.java:524-531 accumulates every section into
# clientLangData (addClientTranslation, :351-368). The language key must be `zh_cn`, exactly as
# spelled in internal/lang/processed.json, or addClientTranslation drops it silently (:358-366).

